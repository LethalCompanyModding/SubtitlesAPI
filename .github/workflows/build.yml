name: Build on Push

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Use checkout to publish the files in your repo
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.x"

      - name: Restore and Build
        run: |
          dotnet restore SubtitlesAPI.sln
          dotnet tool
          dotnet build SubtitlesAPI.sln -c Release
